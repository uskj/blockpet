<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockPet v6<title>BlockPet v7 - powered by 漫庐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; min-height: 100vh; color: #fff; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        button { cursor: pointer; }
        .btn { padding: 14px 20px; border: none; border-radius: 8px; font-size: 16px; background: #4a9eff; color: #fff; margin: 10px 0; width: 100%; }
        .btn-secondary { background: #666; }
        .btn-success { background: #4caf50; }
        .hidden { display: none !important; }
        .card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        input[type="text"] { width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 14px; }
        label { color: #aaa; font-size: 12px; margin-top: 15px; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BlockPet v6</h1>
        <p style="color:#888;margin-bottom:20px;">AI情绪宠物 · Agnes AI</p>
        
        <div id="homePage">
            <div class="card">
                <p>🏠 我的方块宠物</p>
                <div id="petList" style="margin:15px 0;"></div>
                <button class="btn" onclick="showCreatePet()">➕ 创建新宠物</button>
            </div>
        </div>
        
        <div id="creationPhase" class="hidden">
            <div class="card">
                <p>📝 创建你的方块宠</p>
                <label>名字</label>
                <input type="text" id="nameInput" placeholder="给你的宠物起个名字...">
                <label>选择颜色</label>
                <div id="colorGrid" style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;"></div>
                <button class="btn btn-success" onclick="previewPet()" style="margin-top:20px;">🔍 预览外观</button>
                <button class="btn btn-secondary" onclick="backToHome()">返回</button>
            </div>
        </div>
        
        <div id="previewPhase" class="hidden">
            <div class="card">
                <p>👁️ 预览 - <span id="previewName"></span></p>
                <button class="btn btn-success" onclick="confirmCreation()">✅ 确认创建</button>
                <button class="btn btn-secondary" onclick="backToEdit()">✏️ 返回修改</button>
            </div>
        </div>
        
        <div id="mainApp" class="hidden">
            <div class="card">
                <p id="mainName" style="font-size:24px;text-align:center;margin-bottom:10px;"></p>
                <p id="mainLevel" style="color:#ffd700;text-align:center;"></p>
            </div>
            <div class="card">
                <p>💬 聊天</p>
                <div id="chatBox" style="height:200px;overflow-y:auto;background:rgba(0,0,0,0.3);border-radius:8px;padding:10px;margin:10px 0;"></div>
                <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
            </div>
        </div>
    </div>

    <script>
        let petState = { name: '', color: '#ff6b6b', level: 1, tasks: [] };
        let chatHistory = [];
        let currentPetIndex = 0;
        
        const AGNES_API_URL = 'https://api.agnes-ai.cn/v1/chat/completions';
        const AGNES_API_KEY = 'sk-UMO0xnCQNlCoJd8AKbnhejVNdEdr4cXsUEg24RiSHnspeMmj';
        const AGNES_MODEL = 'agnes-2.5-flash';
        const COLORS = ['#ff6b6b','#ee5a5a','#4ecdc4','#45b7d1','#96ceb4','#27ae60','#ffeaa7','#f1c40f'];

        function init() {
            var colorGrid = document.getElementById('colorGrid');
            for (var i = 0; i < COLORS.length; i++) {
                var div = document.createElement('div');
                div.style.cssText = 'width:40px;height:40px;border-radius:8px;background:' + COLORS[i] + ';cursor:pointer;border:3px solid transparent;';
                if (i === 0) div.style.borderColor = '#fff';
                div.onclick = (function(color) {
                    return function() {
                        petState.color = color;
                        document.getElementById('previewName').textContent = petState.name || '方块宠';
                    };
                })(COLORS[i]);
                colorGrid.appendChild(div);
            }
            loadPets();
        }

        window.showCreatePet = function() {
            document.getElementById('homePage').className = 'hidden';
            document.getElementById('creationPhase').className = '';
            document.getElementById('nameInput').value = '';
            petState = { name: '', color: '#ff6b6b', level: 1, tasks: [] };
        };

        window.backToHome = function() {
            document.getElementById('creationPhase').className = 'hidden';
            document.getElementById('homePage').className = '';
        };

        window.previewPet = function() {
            var name = document.getElementById('nameInput').value.trim();
            if (!name) { alert('请输入名字'); return; }
            petState.name = name;
            document.getElementById('previewName').textContent = name;
            document.getElementById('creationPhase').className = 'hidden';
            document.getElementById('previewPhase').className = '';
        };

        window.backToEdit = function() {
            document.getElementById('previewPhase').className = 'hidden';
            document.getElementById('creationPhase').className = '';
        };

        window.confirmCreation = function() {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            pets.push(petState);
            localStorage.setItem('blockpet_all', JSON.stringify(pets));
            document.getElementById('previewPhase').className = 'hidden';
            document.getElementById('homePage').className = '';
            loadPets();
            alert('宠物创建成功！');
        };

        function loadPets() {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            var list = document.getElementById('petList');
            if (pets.length === 0) {
                list.innerHTML = '<p style="color:#888;">还没有宠物，创建一个吧！</p>';
            } else {
                list.innerHTML = '';
                for (var i = 0; i < pets.length; i++) {
                    (function(p, idx) {
                        var div = document.createElement('div');
                        div.style.cssText = 'padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;';
                        div.innerHTML = '<div style="width:30px;height:30px;background:' + p.color + ';border-radius:4px;"></div><span>' + p.name + '</span>';
                        div.onclick = function() { selectPet(idx); };
                        list.appendChild(div);
                    })(pets[i], i);
                }
            }
        }

        window.selectPet = function(index) {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            if (pets[index]) {
                petState = pets[index];
                currentPetIndex = index;
                chatHistory = [];
                document.getElementById('homePage').className = 'hidden';
                document.getElementById('mainApp').className = '';
                document.getElementById('mainName').textContent = petState.name;
                document.getElementById('mainLevel').textContent = 'Lv.' + petState.level;
                addSystemMessage('你好！我是 ' + petState.name + '，你的专属方块宠物！');
            }
        };

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') sendChat();
        };

        async function sendChat() {
            var input = document.getElementById('chatInput');
            var message = input.value.trim();
            if (!message) return;
            
            addUserMessage(message);
            input.value = '';
            
            var thinkingMsg = document.createElement('div');
            thinkingMsg.textContent = '💭 思考中...';
            thinkingMsg.style.cssText = 'color:#888;font-style:italic;padding:10px;';
            document.getElementById('chatBox').appendChild(thinkingMsg);
            scrollChat();
            
            try {
                var systemPrompt = '你是' + petState.name + '，一个可爱的像素方块宠物。用中文回复，简短可爱。';
                
                var r = await fetch(AGNES_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + AGNES_API_KEY
                    },
                    body: JSON.stringify({
                        model: AGNES_MODEL,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            ...chatHistory,
                            { role: 'user', content: message }
                        ]
                    })
                });
                var d = await r.json();
                thinkingMsg.remove();
                
                var reply = d.choices && d.choices[0] && d.choices[0].message ? d.choices[0].message.content : '...';
                chatHistory.push({ role: 'user', content: message });
                chatHistory.push({ role: 'assistant', content: reply });
                addPetMessage(reply);
            } catch(e) {
                thinkingMsg.remove();
                addPetMessage('网络错误，请稍后重试~');
                console.error(e);
            }
        }

        function addUserMessage(text) {
            var msg = document.createElement('div');
            msg.textContent = text;
            msg.style.cssText = 'background:#4a9eff;color:#fff;padding:8px 12px;border-radius:12px;margin-bottom:8px;';
            document.getElementById('chatBox').appendChild(msg);
            scrollChat();
        }

        function addPetMessage(text) {
            var msg = document.createElement('div');
            msg.textContent = text;
            msg.style.cssText = 'background:rgba(255,255,255,0.1);color:#ddd;padding:8px 12px;border-radius:12px;margin-bottom:8px;';
            document.getElementById('chatBox').appendChild(msg);
            scrollChat();
        }

        function addSystemMessage(text) {
            addPetMessage(text);
        }

        function scrollChat() {
            var box = document.getElementById('chatBox');
            box.scrollTop = box.scrollHeight;
        }

        init();
    </script>
</body>
</html>
