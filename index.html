<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockPet - powered by 漫庐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        button { cursor: pointer; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; margin: 10px 0; }
        .btn-primary { background: linear-gradient(135deg, #4a9eff 0%, #357abd 100%); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #4caf50 0%, #45a049 100%); color: #fff; }
        .hidden { display: none !important; }
        .card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }
        input[type="text"] { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: #4a9eff; }
        label { color: #aaa; font-size: 12px; margin-top: 15px; display: block; }
        .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 10px 0; }
        .color-option { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
        .color-option:hover { transform: scale(1.1); }
        .color-option.selected { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .accessory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0; }
        .accessory-option { padding: 12px 8px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s; font-size: 12px; }
        .accessory-option:hover { border-color: #4a9eff; }
        .accessory-option.selected { border-color: #4a9eff; background: rgba(74,158,255,0.2); }
        .accessory-option .emoji { font-size: 24px; display: block; margin-bottom: 4px; }
        .chat-box { height: 250px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .message { margin-bottom: 10px; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .message.user { background: #4a9eff; color: #fff; margin-left: 20%; border-radius: 12px 12px 0 12px; }
        .message.pet { background: rgba(255,255,255,0.1); color: #ddd; margin-right: 20%; border-radius: 12px 12px 12px 0; }
        .message.thinking { color: #888; font-style: italic; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: rgba(255,255,255,0.05); border: none; border-radius: 8px; color: #888; font-size: 14px; cursor: pointer; }
        .tab.active { background: #4a9eff; color: #fff; }
        .task-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; }
        .task-item.completed { opacity: 0.5; text-decoration: line-through; }
        .pet-info { text-align: center; margin: 20px 0; }
        .pet-name { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .pet-level { color: #ffd700; font-size: 14px; }
        .cube-container { width: 200px; height: 200px; margin: 30px auto; perspective: 600px; }
        .cube { width: 100px; height: 100px; position: relative; transform-style: preserve-3d; transform: rotateX(-25deg) rotateY(-45deg); animation: rotate 8s infinite linear; margin: 50px auto; }
        @keyframes rotate { from { transform: rotateX(-25deg) rotateY(0deg); } to { transform: rotateX(-25deg) rotateY(360deg); } }
        .face { position: absolute; width: 100px; height: 100px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); border: 1px solid rgba(0,0,0,0.3); }
        .pixel { width: 100%; height: 100%; }
        .front { transform: translateZ(50px); }
        .back { transform: rotateY(180deg) translateZ(50px); }
        .right { transform: rotateY(90deg) translateZ(50px); }
        .left { transform: rotateY(-90deg) translateZ(50px); }
        .top { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }
        .notification { position: fixed; top: 20px; right: 20px; background: #4a9eff; color: #fff; padding: 12px 20px; border-radius: 8px; display: none; z-index: 1000; }
        .lock-overlay { position: relative; }
        .lock-overlay::after { content: '🔒 解锁后使用'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align:center;padding:20px 0;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:20px;">
            <h1>⬛ BlockPet ⬛</h1>
            <p style="color:#888;font-size:14px;">powered by 漫庐</p>
        </header>
        
        <div id="homePage">
            <div class="card">
                <p style="font-weight:600;margin-bottom:15px;">🏠 我的方块宠物</p>
                <div id="petList" style="margin-bottom:20px;"></div>
                <button class="btn btn-primary" onclick="showCreatePet()">➕ 创建新宠物</button>
            </div>
        </div>
        
        <div id="creationPhase" class="hidden">
            <div class="card">
                <p style="font-weight:600;margin-bottom:15px;">📝 创建你的方块宠</p>
                <label>名字</label>
                <input type="text" id="nameInput" placeholder="给你的宠物起个名字..." maxlength="10">
                <label>选择颜色</label>
                <div class="color-grid" id="colorGrid"></div>
                <label>选择配饰</label>
                <div class="accessory-grid" id="accessoryGrid"></div>
                <button class="btn btn-success" onclick="previewPet()" style="margin-top:20px;">🔍 预览外观</button>
                <button class="btn btn-secondary" onclick="backToHome()">返回</button>
            </div>
        </div>
        
        <div id="previewPhase" class="hidden">
            <div class="card">
                <p style="font-weight:600;margin-bottom:15px;">👁️ 预览</p>
                <div class="cube-container">
                    <div class="cube" id="previewCube">
                        <div class="face front" id="previewFront"></div>
                        <div class="face back" id="previewBack"></div>
                        <div class="face right" id="previewRight"></div>
                        <div class="face left" id="previewLeft"></div>
                        <div class="face top" id="previewTop"></div>
                        <div class="face bottom" id="previewBottom"></div>
                    </div>
                </div>
                <p id="previewName" style="text-align:center;font-size:20px;margin-bottom:5px;"></p>
                <button class="btn btn-success" onclick="confirmCreation()">✅ 确认创建</button>
                <button class="btn btn-secondary" onclick="backToEdit()">✏️ 返回修改</button>
            </div>
        </div>
        
        <div id="mainApp" class="hidden">
            <div class="cube-container">
                <div class="cube" id="mainCube">
                    <div class="face front" id="mainFront"></div>
                    <div class="face back" id="mainBack"></div>
                    <div class="face right" id="mainRight"></div>
                    <div class="face left" id="mainLeft"></div>
                    <div class="face top" id="mainTop"></div>
                    <div class="face bottom" id="mainBottom"></div>
                </div>
            </div>
            <div class="pet-info">
                <div class="pet-name" id="mainName"></div>
                <div class="pet-level">Lv.<span id="mainLevel"></span></div>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('chat')">💬 聊天</button>
                <button class="tab" onclick="switchTab('tasks')">📋 任务</button>
            </div>
            <div id="chatTab" class="card">
                <div id="chatBox" class="chat-box"></div>
                <input type="text" id="chatInput" placeholder="输入消息... (回车发送)" onkeypress="handleKeyPress(event)">
            </div>
            <div id="tasksTab" class="card hidden lock-overlay">
                <p style="font-weight:600;margin-bottom:15px;">📋 我的任务</p>
                <p style="color:#888;text-align:center;margin-bottom:15px;">💎 解锁会员后可使用任务功能</p>
                <button class="btn btn-primary" onclick="unlockTasks()">🔓 解锁任务功能</button>
            </div>
        </div>
    </div>
    <div id="notification" class="notification"></div>

    <script>
        var petState = { name: '', color: '#ff6b6b', accessory: 'none', level: 1, tasks: [], unlocked: false };
        var chatHistory = [];
        var currentPetIndex = 0;
        var chatCount = 0;
        
        var AGNES_API_URL = 'https://api.agnes-ai.cn/v1/chat/completions';
        var AGNES_API_KEY = 'sk-UMO0xnCQNlCoJd8AKbnhejVNdEdr4cXsUEg24RiSHnspeMmj';
        var AGNES_MODEL = 'agnes-2.5-flash';
        
        var COLORS = ['#ff6b6b','#ee5a5a','#4ecdc4','#45b7d1','#96ceb4','#27ae60','#ffeaa7','#f1c40f','#dda0dd','#9b59b6','#85c1e9','#5dade2'];
        var ACCESSORIES = [
            { id: 'none', name: '无', emoji: '❌' },
            { id: 'hat', name: '帽子', emoji: '🎩' },
            { id: 'glasses', name: '眼镜', emoji: '👓' },
            { id: 'bow', name: '蝴蝶结', emoji: '🎀' },
            { id: 'crown', name: '皇冠', emoji: '👑' }
        ];

        function init() {
            var colorGrid = document.getElementById('colorGrid');
            for (var i = 0; i < COLORS.length; i++) {
                (function(color, idx) {
                    var div = document.createElement('div');
                    div.className = 'color-option' + (idx === 0 ? ' selected' : '');
                    div.style.background = color;
                    div.onclick = function() {
                        document.querySelectorAll('.color-option').forEach(function(e) { e.classList.remove('selected'); });
                        div.classList.add('selected');
                        petState.color = color;
                        updatePreview();
                    };
                    colorGrid.appendChild(div);
                })(COLORS[i], i);
            }
            
            var accessoryGrid = document.getElementById('accessoryGrid');
            for (var j = 0; j < ACCESSORIES.length; j++) {
                (function(acc, idx) {
                    var div = document.createElement('div');
                    div.className = 'accessory-option' + (idx === 0 ? ' selected' : '');
                    div.innerHTML = '<span class="emoji">' + acc.emoji + '</span>' + acc.name;
                    div.onclick = function() {
                        document.querySelectorAll('.accessory-option').forEach(function(e) { e.classList.remove('selected'); });
                        div.classList.add('selected');
                        petState.accessory = acc.id;
                        updatePreview();
                    };
                    accessoryGrid.appendChild(div);
                })(ACCESSORIES[j], j);
            }
            
            loadPets();
        }

        function darkenColor(hex, percent) {
            var num = parseInt(hex.replace('#',''), 16);
            var amt = Math.round(2.55 * percent);
            var R = Math.max(0, (num >> 16) - amt);
            var G = Math.max(0, ((num >> 8) & 0xFF) - amt);
            var B = Math.max(0, (num & 0xFF) - amt);
            return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
        }

        function renderFace(element, baseColor, isFront) {
            element.innerHTML = '';
            for (var row = 0; row < 10; row++) {
                for (var col = 0; col < 10; col++) {
                    var pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    var bg = baseColor;
                    if (isFront) {
                        if ((row === 3 || row === 4) && (col === 2 || col === 3 || col === 6 || col === 7)) {
                            bg = row === 4 ? '#111' : '#fff';
                        }
                        if (row === 7 && col >= 3 && col <= 6) bg = '#e94560';
                    }
                    pixel.style.background = bg;
                    element.appendChild(pixel);
                }
            }
        }

        function updatePreview() {
            var faces = ['previewFront','previewBack','previewRight','previewLeft','previewTop','previewBottom'];
            var colors = [petState.color, darkenColor(petState.color,10), darkenColor(petState.color,20),
                         darkenColor(petState.color,10), darkenColor(petState.color,25), darkenColor(petState.color,30)];
            for (var i = 0; i < faces.length; i++) {
                var el = document.getElementById(faces[i]);
                if (el) renderFace(el, colors[i], faces[i].indexOf('Front') >= 0);
            }
            var name = document.getElementById('nameInput').value;
            document.getElementById('previewName').textContent = name || '方块宠';
        }

        window.showCreatePet = function() {
            document.getElementById('homePage').className = 'hidden';
            document.getElementById('creationPhase').className = '';
            document.getElementById('nameInput').value = '';
            petState = { name: '', color: '#ff6b6b', accessory: 'none', level: 1, tasks: [], unlocked: false };
        };

        window.backToHome = function() {
            document.getElementById('creationPhase').className = 'hidden';
            document.getElementById('homePage').className = '';
        };

        window.previewPet = function() {
            var name = document.getElementById('nameInput').value.trim();
            if (!name) { alert('请输入名字'); return; }
            petState.name = name;
            document.getElementById('creationPhase').className = 'hidden';
            document.getElementById('previewPhase').className = '';
            updatePreview();
        };

        window.backToEdit = function() {
            document.getElementById('previewPhase').className = 'hidden';
            document.getElementById('creationPhase').className = '';
        };

        window.confirmCreation = function() {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            pets.push(petState);
            localStorage.setItem('blockpet_all', JSON.stringify(pets));
            document.getElementById('previewPhase').className = 'hidden';
            document.getElementById('homePage').className = '';
            loadPets();
            showNotification('宠物创建成功！');
        };

        function loadPets() {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            var list = document.getElementById('petList');
            if (pets.length === 0) {
                list.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">还没有宠物，创建一个吧！</p>';
            } else {
                list.innerHTML = '';
                for (var i = 0; i < pets.length; i++) {
                    (function(p, idx) {
                        var div = document.createElement('div');
                        div.className = 'task-item';
                        div.style.cursor = 'pointer';
                        div.innerHTML = '<div style="width:40px;height:40px;background:' + p.color + ';border-radius:8px;"></div><span style="flex:1;">' + p.name + '</span><span style="color:#888;font-size:12px;">Lv.' + p.level + '</span>';
                        div.onclick = function() { selectPet(idx); };
                        list.appendChild(div);
                    })(pets[i], i);
                }
            }
        }

        window.selectPet = function(index) {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            if (pets[index]) {
                petState = pets[index];
                currentPetIndex = index;
                chatHistory = [];
                chatCount = 0;
                document.getElementById('homePage').className = 'hidden';
                document.getElementById('mainApp').className = '';
                updateMainDisplay();
                addSystemMessage('你好！我是 ' + petState.name + '，你的专属方块宠物！✨');
            }
        };

        function updateMainDisplay() {
            var faces = ['mainFront','mainBack','mainRight','mainLeft','mainTop','mainBottom'];
            var colors = [petState.color, darkenColor(petState.color,10), darkenColor(petState.color,20),
                         darkenColor(petState.color,10), darkenColor(petState.color,25), darkenColor(petState.color,30)];
            for (var i = 0; i < faces.length; i++) {
                var el = document.getElementById(faces[i]);
                if (el) renderFace(el, colors[i], faces[i].indexOf('Front') >= 0);
            }
            document.getElementById('mainName').textContent = petState.name;
            document.getElementById('mainLevel').textContent = petState.level;
        }

        window.switchTab = function(tab) {
            document.getElementById('chatTab').className = tab === 'chat' ? 'card' : 'card hidden';
            document.getElementById('tasksTab').className = tab === 'tasks' ? 'card' : 'card hidden';
            document.querySelectorAll('.tab').forEach(function(btn, i) {
                btn.className = 'tab' + ((tab === 'chat' && i === 0) || (tab === 'tasks' && i === 1) ? ' active' : '');
            });
        };

        window.unlockTasks = function() {
            if (confirm('解锁任务功能？\n\n费用：¥6/月\n\n确认支付？')) {
                petState.unlocked = true;
                savePets();
                document.getElementById('tasksTab').className = 'card';
                document.getElementById('tasksTab').classList.remove('lock-overlay');
                showNotification('任务功能已解锁！');
            }
        };

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') sendChat();
        };

        async function sendChat() {
            var input = document.getElementById('chatInput');
            var message = input.value.trim();
            if (!message) return;
            
            addUserMessage(message);
            input.value = '';
            
            var thinkingMsg = document.createElement('div');
            thinkingMsg.textContent = '💭 思考中...';
            thinkingMsg.className = 'message thinking';
            document.getElementById('chatBox').appendChild(thinkingMsg);
            scrollChat();
            
            try {
                var systemPrompt = '你是' + petState.name + '，一个可爱的像素方块宠物。你会陪伴用户学习工作，提供情绪价值，温暖有趣。用中文回复，简短可爱。';
                
                var r = await fetch(AGNES_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + AGNES_API_KEY
                    },
                    body: JSON.stringify({
                        model: AGNES_MODEL,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: message }
                        ]
                    })
                });
                var d = await r.json();
                thinkingMsg.remove();
                
                var reply = d.choices && d.choices[0] && d.choices[0].message ? d.choices[0].message.content : '...';
                addPetMessage(reply);
                chatCount++;
                
                if (petState.unlocked && chatCount % 10 === 0) {
                    setTimeout(function() {
                        addPetMessage('对了...记得完成任务哦~');
                    }, 1000);
                }
            } catch(e) {
                thinkingMsg.remove();
                addPetMessage('网络错误，请稍后重试~');
                console.error(e);
            }
        }

        function addUserMessage(text) {
            var msg = document.createElement('div');
            msg.className = 'message user';
            msg.textContent = text;
            document.getElementById('chatBox').appendChild(msg);
            scrollChat();
        }

        function addPetMessage(text) {
            var msg = document.createElement('div');
            msg.className = 'message pet';
            msg.textContent = text;
            document.getElementById('chatBox').appendChild(msg);
            scrollChat();
        }

        function addSystemMessage(text) {
            addPetMessage(text);
        }

        function scrollChat() {
            var box = document.getElementById('chatBox');
            box.scrollTop = box.scrollHeight;
        }

        function savePets() {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            pets[currentPetIndex] = petState;
            localStorage.setItem('blockpet_all', JSON.stringify(pets));
        }

        function showNotification(msg) {
            var n = document.getElementById('notification');
            n.textContent = msg;
            n.style.display = 'block';
            setTimeout(function() { n.style.display = 'none'; }, 2000);
        }

        init();
    </script>
</body>
</html>
