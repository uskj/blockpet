<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockPet v4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; min-height: 100vh; color: #fff; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        button { cursor: pointer; }
        .btn { padding: 14px 20px; border: none; border-radius: 8px; font-size: 16px; background: #4a9eff; color: #fff; margin: 10px 0; width: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BlockPet v4</h1>
        <div id="homePage">
            <p>这是首页</p>
            <button class="btn" onclick="showCreatePet()">创建新宠物</button>
        </div>
        <div id="creationPhase" class="hidden">
            <p>这是创建页面</p>
            <button class="btn" onclick="backToHome()">返回</button>
        </div>
    </div>
    <script>
        function showCreatePet() {
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('creationPhase').classList.remove('hidden');
            console.log('showCreatePet called');
        }
        function backToHome() {
            document.getElementById('creationPhase').classList.add('hidden');
            document.getElementById('homePage').classList.remove('hidden');
        }
    </script>
</body>
</html>
