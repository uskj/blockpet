<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockPet v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; min-height: 100vh; color: #fff; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        button { cursor: pointer; }
        .btn { padding: 14px 20px; border: none; border-radius: 8px; font-size: 16px; background: #4a9eff; color: #fff; margin: 10px 0; width: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BlockPet v2</h1>
        <div id="page1">
            <p>这是首页</p>
            <button class="btn" onclick="showPage2()">创建宠物</button>
        </div>
        <div id="page2" class="hidden">
            <p>这是创建页面</p>
            <input type="text" id="nameInput" placeholder="输入名字">
            <button class="btn" onclick="confirmCreate()">确认</button>
            <button class="btn" onclick="showPage1()" style="background:#666;">返回</button>
        </div>
        <div id="page3" class="hidden">
            <p>宠物创建成功！</p>
            <p id="petName"></p>
        </div>
    </div>
    <script>
        function showPage2() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }
        function showPage1() {
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page1').classList.remove('hidden');
        }
        function confirmCreate() {
            const name = document.getElementById('nameInput').value;
            if (!name) { alert('请输入名字'); return; }
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page3').classList.remove('hidden');
            document.getElementById('petName').textContent = '宠物名：' + name;
        }
    </script>
</body>
</html>
