<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlockPet - powered by 漫庐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; overflow-x: hidden; }
        .container { max-width: 480px; margin: 0 auto; padding: 10px; }
        button { cursor: pointer; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; margin: 5px 0; }
        .btn-primary { background: linear-gradient(135deg, #4a9eff 0%, #357abd 100%); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #4caf50 0%, #45a049 100%); color: #fff; }
        .btn-gold { background: linear-gradient(135deg, #ffd700 0%, #ffb300 100%); color: #1a1a2e; }
        .btn-random { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); color: #fff; font-size: 12px; padding: 8px; }
        .hidden { display: none !important; }
        .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        input[type="text"] { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
        input[type="text"]:focus { border-color: #4a9eff; }
        label { color: #aaa; font-size: 11px; margin-top: 8px; display: block; }
        .color-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin: 8px 0; }
        .color-option { aspect-ratio: 1; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .color-option:hover { transform: scale(1.1); }
        .color-option.selected { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .accessory-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 8px 0; }
        .accessory-option { padding: 6px 3px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 6px; text-align: center; cursor: pointer; transition: all 0.2s; font-size: 10px; }
        .accessory-option:hover { border-color: #4a9eff; }
        .accessory-option.selected { border-color: #4a9eff; background: rgba(74,158,255,0.2); }
        .accessory-option .emoji { font-size: 18px; display: block; margin-bottom: 1px; }
        .chat-box { height: 180px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
        .message.user { background: #4a9eff; color: #fff; margin-left: 15%; border-radius: 8px 8px 0 8px; }
        .message.pet { background: rgba(255,255,255,0.1); color: #ddd; margin-right: 15%; border-radius: 8px 8px 8px 0; }
        .message.thinking { color: #888; font-style: italic; font-size: 12px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab { flex: 1; padding: 8px; background: rgba(255,255,255,0.05); border: none; border-radius: 6px; color: #888; font-size: 12px; cursor: pointer; }
        .tab.active { background: #4a9eff; color: #fff; }
        .task-item { display: flex; align-items: center; gap: 8px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 5px; font-size: 13px; }
        .task-item.completed { opacity: 0.5; text-decoration: line-through; }
        .pet-info { text-align: center; margin: 10px 0; }
        .pet-name { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
        .pet-level { color: #ffd700; font-size: 12px; }
        .cube-container { width: 120px; height: 120px; margin: 10px auto; perspective: 400px; }
        .cube { width: 60px; height: 60px; position: relative; transform-style: preserve-3d; transform: rotateX(-25deg) rotateY(-45deg); animation: rotate 8s infinite linear; margin: 20px auto; }
        @keyframes rotate { from { transform: rotateX(-25deg) rotateY(0deg); } to { transform: rotateX(-25deg) rotateY(360deg); } }
        .face { position: absolute; width: 60px; height: 60px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); border: 1px solid rgba(0,0,0,0.3); }
        .pixel { width: 100%; height: 100%; }
        .front { transform: translateZ(30px); }
        .back { transform: rotateY(180deg) translateZ(30px); }
        .right { transform: rotateY(90deg) translateZ(30px); }
        .left { transform: rotateY(-90deg) translateZ(30px); }
        .top { transform: rotateX(90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }
        .notification { position: fixed; top: 10px; right: 10px; background: #4a9eff; color: #fff; padding: 8px 12px; border-radius: 6px; display: none; z-index: 1000; font-size: 12px; }
        .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        .price-item { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .price-item:hover { border-color: #ffd700; transform: translateY(-3px); }
        .price-item.selected { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .price-item.popular { border-color: #ffd700; position: relative; }
        .price-item.popular::before { content: '划算'; position: absolute; top: -8px; right: 5px; background: #ffd700; color: #1a1a2e; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 8px; }
        .price-icon { font-size: 24px; margin-bottom: 5px; }
        .price-amount { font-size: 20px; font-weight: 700; color: #ffd700; }
        .price-unit { font-size: 11px; color: #888; }
        .price-desc { font-size: 10px; color: #aaa; margin-top: 4px; }
        .lock-overlay { position: relative; overflow: hidden; }
        .lock-overlay::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(26,26,46,0.7); border-radius: 12px; z-index: 1; }
        .lock-content { position: relative; z-index: 2; text-align: center; padding: 15px; }
        .random-hint { font-size: 10px; color: #888; margin-top: 3px; text-align: center; }
        header { text-align: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        header h1 { font-size: 20px; margin-bottom: 2px; }
        header p { color: #888; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⬛ BlockPet ⬛</h1>
            <p>powered by 漫庐</p>
        </header>
        
        <div id="homePage">
            <div class="card">
                <p style="font-weight:600;margin-bottom:10px;font-size:14px;">🏠 我的方块宠物</p>
                <div id="petList" style="margin-bottom:10px;"></div>
                <button class="btn btn-primary" onclick="showCreatePet()">➕ 创建新宠物</button>
                <button class="btn btn-gold" onclick="showShop()" style="margin-top:5px;">💎 解锁会员</button>
            </div>
        </div>
        
        <div id="creationPhase" class="hidden">
            <div class="card">
                <p style="font-weight:600;margin-bottom:10px;font-size:14px;">📝 创建你的方块宠</p>
                <label>名字</label>
                <input type="text" id="nameInput" placeholder="起个名字..." maxlength="10">
                <label>颜色</label>
                <div class="color-grid" id="colorGrid"></div>
                <button class="btn btn-random" onclick="randomColor()">🎲 随机</button>
                <label>配饰</label>
                <div class="accessory-grid" id="accessoryGrid"></div>
                <button class="btn btn-random" onclick="randomAccessory()">🎲 随机</button>
                <button class="btn btn-success" onclick="previewPet()" style="margin-top:10px;">🔍 预览</button>
                <button class="btn btn-secondary" onclick="backToHome()">返回</button>
            </div>
        </div>
        
        <div id="previewPhase" class="hidden">
            <div class="card">
                <p style="font-weight:600;margin-bottom:10px;font-size:14px;">👁️ 预览</p>
                <div class="cube-container">
                    <div class="cube" id="previewCube">
                        <div class="face front" id="previewFront"></div>
                        <div class="face back" id="previewBack"></div>
                        <div class="face right" id="previewRight"></div>
                        <div class="face left" id="previewLeft"></div>
                        <div class="face top" id="previewTop"></div>
                        <div class="face bottom" id="previewBottom"></div>
                    </div>
                </div>
                <p id="previewName" style="text-align:center;font-size:16px;margin-bottom:10px;"></p>
                <button class="btn btn-success" onclick="confirmCreation()">✅ 确认</button>
                <button class="btn btn-secondary" onclick="backToEdit()">返回</button>
            </div>
        </div>
        
        <div id="mainApp" class="hidden">
            <div class="cube-container">
                <div class="cube" id="mainCube">
                    <div class="face front" id="mainFront"></div>
                    <div class="face back" id="mainBack"></div>
                    <div class="face right" id="mainRight"></div>
                    <div class="face left" id="mainLeft"></div>
                    <div class="face top" id="mainTop"></div>
                    <div class="face bottom" id="mainBottom"></div>
                </div>
            </div>
            <div class="pet-info">
                <div class="pet-name" id="mainName"></div>
                <div class="pet-level">Lv.<span id="mainLevel"></span></div>
                <div id="memberBadge" style="display:none;margin-top:3px;color:#ffd700;font-size:11px;">💎 会员</div>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('chat')">💬 聊天</button>
                <button class="tab" onclick="switchTab('tasks')">📋 任务</button>
            </div>
            <div id="chatTab" class="card">
                <div id="chatBox" class="chat-box"></div>
                <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
            </div>
            <div id="tasksTab" class="card hidden lock-overlay">
                <div class="lock-content">
                    <p style="font-size:32px;margin-bottom:8px;">🔒</p>
                    <p style="font-weight:600;margin-bottom:5px;font-size:14px;">任务功能需解锁</p>
                    <p style="color:#888;font-size:11px;margin-bottom:12px;">成为会员后可使用</p>
                    <button class="btn btn-gold" onclick="showShop()">💎 解锁</button>
                    <button class="btn btn-secondary" onclick="switchTab('chat')" style="margin-top:5px;">返回</button>
                </div>
            </div>
        </div>
        
        <div id="shopModal" class="hidden">
            <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:3000;display:flex;align-items:center;justify-content:center;padding:15px;">
                <div class="card" style="max-width:320px;width:100%;">
                    <p style="font-weight:700;font-size:16px;text-align:center;margin-bottom:3px;">💎 解锁会员</p>
                    <p style="color:#888;text-align:center;font-size:11px;margin-bottom:12px;">解锁任务功能</p>
                    
                    <div class="price-grid">
                        <div class="price-item" onclick="selectPlan('monthly')">
                            <div class="price-icon">📅</div>
                            <div class="price-amount">¥9.9</div>
                            <div class="price-unit">/月</div>
                            <div class="price-desc">随时取消</div>
                        </div>
                        <div class="price-item popular" onclick="selectPlan('yearly')">
                            <div class="price-icon">🎁</div>
                            <div class="price-amount">¥25</div>
                            <div class="price-unit">/年</div>
                            <div class="price-desc">立省¥44</div>
                        </div>
                    </div>
                    
                    <button class="btn btn-gold" onclick="confirmPurchase()" id="purchaseBtn">立即开通</button>
                    <button class="btn btn-secondary" onclick="closeShop()" style="margin-top:5px;">取消</button>
                </div>
            </div>
        </div>
    </div>
    <div id="notification" class="notification"></div>

    <script>
        var petState = { name: '', color: '#ff6b6b', accessory: 'none', level: 1, tasks: [], member: false, selectedPlan: null };
        var chatHistory = [];
        var currentPetIndex = 0;
        var chatCount = 0;
        
        var AGNES_API_URL = 'https://api.agnes-ai.cn/v1/chat/completions';
        var AGNES_API_KEY = 'sk-UMO0xnCQNlCoJd8AKbnhejVNdEdr4cXsUEg24RiSHnspeMmj';
        var AGNES_MODEL = 'agnes-2.5-flash';
        
        var COLORS = ['#ff6b6b','#ee5a5a','#4ecdc4','#45b7d1','#96ceb4','#27ae60','#ffeaa7','#f1c40f','#dda0dd','#9b59b6','#85c1e9','#5dade2','#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#2c3e50'];
        var ACCESSORIES = [
            { id: 'none', name: '无', emoji: '❌' },
            { id: 'hat', name: '帽子', emoji: '🎩' },
            { id: 'glasses', name: '眼镜', emoji: '👓' },
            { id: 'bow', name: '蝴蝶结', emoji: '🎀' },
            { id: 'crown', name: '皇冠', emoji: '👑' },
            { id: 'star', name: '星星', emoji: '⭐' },
            { id: 'heart', name: '爱心', emoji: '❤️' },
            { id: 'moon', name: '月亮', emoji: '🌙' },
            { id: 'sun', name: '太阳', emoji: '☀️' },
            { id: 'flower', name: '花朵', emoji: '🌸' }
        ];

        function init() {
            var colorGrid = document.getElementById('colorGrid');
            for (var i = 0; i < COLORS.length; i++) {
                (function(color, idx) {
                    var div = document.createElement('div');
                    div.className = 'color-option' + (idx === 0 ? ' selected' : '');
                    div.style.background = color;
                    div.onclick = function() {
                        document.querySelectorAll('.color-option').forEach(function(e) { e.classList.remove('selected'); });
                        div.classList.add('selected');
                        petState.color = color;
                        updatePreview();
                    };
                    colorGrid.appendChild(div);
                })(COLORS[i], i);
            }
            
            var accessoryGrid = document.getElementById('accessoryGrid');
            for (var j = 0; j < ACCESSORIES.length; j++) {
                (function(acc, idx) {
                    var div = document.createElement('div');
                    div.className = 'accessory-option' + (idx === 0 ? ' selected' : '');
                    div.innerHTML = '<span class="emoji">' + acc.emoji + '</span>' + acc.name;
                    div.onclick = function() {
                        document.querySelectorAll('.accessory-option').forEach(function(e) { e.classList.remove('selected'); });
                        div.classList.add('selected');
                        petState.accessory = acc.id;
                        updatePreview();
                    };
                    accessoryGrid.appendChild(div);
                })(ACCESSORIES[j], j);
            }
            
            loadPets();
        }

        window.randomColor = function() {
            var randomIdx = Math.floor(Math.random() * COLORS.length);
            var color = COLORS[randomIdx];
            petState.color = color;
            document.querySelectorAll('.color-option').forEach(function(el, idx) {
                el.classList.toggle('selected', idx === randomIdx);
            });
            updatePreview();
            showNotification('🎨 随机颜色');
        };

        window.randomAccessory = function() {
            var randomIdx = Math.floor(Math.random() * ACCESSORIES.length);
            var acc = ACCESSORIES[randomIdx];
            petState.accessory = acc.id;
            document.querySelectorAll('.accessory-option').forEach(function(el, idx) {
                el.classList.toggle('selected', idx === randomIdx);
            });
            updatePreview();
            showNotification('✨ 随机配饰');
        };

        function darkenColor(hex, percent) {
            var num = parseInt(hex.replace('#',''), 16);
            var amt = Math.round(2.55 * percent);
            var R = Math.max(0, (num >> 16) - amt);
            var G = Math.max(0, ((num >> 8) & 0xFF) - amt);
            var B = Math.max(0, (num & 0xFF) - amt);
            return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
        }

        function renderFace(element, baseColor, isFront) {
            element.innerHTML = '';
            for (var row = 0; row < 10; row++) {
                for (var col = 0; col < 10; col++) {
                    var pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    var bg = baseColor;
                    if (isFront) {
                        if ((row === 3 || row === 4) && (col === 2 || col === 3 || col === 6 || col === 7)) {
                            bg = row === 4 ? '#111' : '#fff';
                        }
                        if (row === 7 && col >= 3 && col <= 6) bg = '#e94560';
                        if (petState.accessory === 'hat' && row === 1 && col >= 3 && col <= 6) bg = '#ffd700';
                        if (petState.accessory === 'glasses' && ((row === 3 && col >= 1 && col <= 4) || (row === 3 && col >= 5 && col <= 8))) bg = '#333';
                        if (petState.accessory === 'bow' && row === 2 && col >= 4 && col <= 5) bg = '#ff6b9d';
                        if (petState.accessory === 'crown' && row === 1 && col >= 2 && col <= 7) bg = '#ffd700';
                        if (petState.accessory === 'star' && row === 0 && col === 4) bg = '#ffd700';
                        if (petState.accessory === 'heart' && row === 5 && col === 4) bg = '#e94560';
                        if (petState.accessory === 'moon' && row === 2 && col === 7) bg = '#f1c40f';
                        if (petState.accessory === 'sun' && row === 1 && col === 7) bg = '#f39c12';
                        if (petState.accessory === 'flower' && row === 6 && col === 4) bg = '#e91e63';
                    }
                    pixel.style.background = bg;
                    element.appendChild(pixel);
                }
            }
        }

        function updatePreview() {
            var faces = ['previewFront','previewBack','previewRight','previewLeft','previewTop','previewBottom'];
            var colors = [petState.color, darkenColor(petState.color,10), darkenColor(petState.color,20),
                         darkenColor(petState.color,10), darkenColor(petState.color,25), darkenColor(petState.color,30)];
            for (var i = 0; i < faces.length; i++) {
                var el = document.getElementById(faces[i]);
                if (el) renderFace(el, colors[i], faces[i].indexOf('Front') >= 0);
            }
            var name = document.getElementById('nameInput').value;
            document.getElementById('previewName').textContent = name || '方块宠';
        }

        window.showCreatePet = function() {
            document.getElementById('homePage').className = 'hidden';
            document.getElementById('creationPhase').className = '';
            document.getElementById('nameInput').value = '';
            petState = { name: '', color: '#ff6b6b', accessory: 'none', level: 1, tasks: [], member: false, selectedPlan: null };
        };

        window.backToHome = function() {
            document.getElementById('creationPhase').className = 'hidden';
            document.getElementById('homePage').className = '';
        };

        window.previewPet = function() {
            var name = document.getElementById('nameInput').value.trim();
            if (!name) { alert('请输入名字'); return; }
            petState.name = name;
            document.getElementById('creationPhase').className = 'hidden';
            document.getElementById('previewPhase').className = '';
            updatePreview();
        };

        window.backToEdit = function() {
            document.getElementById('previewPhase').className = 'hidden';
            document.getElementById('creationPhase').className = '';
        };

        window.confirmCreation = function() {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            pets.push(petState);
            localStorage.setItem('blockpet_all', JSON.stringify(pets));
            document.getElementById('previewPhase').className = 'hidden';
            document.getElementById('homePage').className = '';
            loadPets();
            showNotification('宠物创建成功！');
        };

        function loadPets() {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            var list = document.getElementById('petList');
            if (pets.length === 0) {
                list.innerHTML = '<p style="color:#888;text-align:center;padding:15px;font-size:13px;">还没有宠物，创建一个吧！</p>';
            } else {
                list.innerHTML = '';
                for (var i = 0; i < pets.length; i++) {
                    (function(p, idx) {
                        var div = document.createElement('div');
                        div.className = 'task-item';
                        div.style.cursor = 'pointer';
                        var accEmoji = '';
                        for (var j = 0; j < ACCESSORIES.length; j++) {
                            if (ACCESSORIES[j].id === p.accessory) { accEmoji = ACCESSORIES[j].emoji; break; }
                        }
                        div.innerHTML = '<div style="width:32px;height:32px;background:' + p.color + ';border-radius:6px;position:relative;flex-shrink:0;"><span style="position:absolute;top:-3px;right:-3px;font-size:12px;">' + accEmoji + '</span></div><span style="flex:1;font-size:13px;">' + p.name + '</span><span style="color:#888;font-size:11px;">Lv.' + p.level + (p.member ? ' 💎' : '') + '</span>';
                        div.onclick = function() { selectPet(idx); };
                        list.appendChild(div);
                    })(pets[i], i);
                }
            }
        }

        window.selectPet = function(index) {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            if (pets[index]) {
                petState = pets[index];
                currentPetIndex = index;
                chatHistory = [];
                chatCount = 0;
                document.getElementById('homePage').className = 'hidden';
                document.getElementById('mainApp').className = '';
                document.getElementById('memberBadge').style.display = petState.member ? 'block' : 'none';
                updateMainDisplay();
                addSystemMessage('你好！我是 ' + petState.name + '！✨' + (petState.member ? '<br>💎 会员特权已激活' : ''));
            }
        };

        function updateMainDisplay() {
            var faces = ['mainFront','mainBack','mainRight','mainLeft','mainTop','mainBottom'];
            var colors = [petState.color, darkenColor(petState.color,10), darkenColor(petState.color,20),
                         darkenColor(petState.color,10), darkenColor(petState.color,25), darkenColor(petState.color,30)];
            for (var i = 0; i < faces.length; i++) {
                var el = document.getElementById(faces[i]);
                if (el) renderFace(el, colors[i], faces[i].indexOf('Front') >= 0);
            }
            document.getElementById('mainName').textContent = petState.name;
            document.getElementById('mainLevel').textContent = petState.level;
        }

        window.switchTab = function(tab) {
            document.getElementById('chatTab').className = tab === 'chat' ? 'card' : 'card hidden';
            document.getElementById('tasksTab').className = tab === 'tasks' ? 'card' : 'card hidden';
            if (tab === 'tasks' && !petState.member) {
                document.getElementById('tasksTab').classList.add('lock-overlay');
            } else {
                document.getElementById('tasksTab').classList.remove('lock-overlay');
            }
            document.querySelectorAll('.tab').forEach(function(btn, i) {
                btn.className = 'tab' + ((tab === 'chat' && i === 0) || (tab === 'tasks' && i === 1) ? ' active' : '');
            });
        };

        window.showShop = function() {
            document.getElementById('shopModal').className = '';
        };

        window.closeShop = function() {
            document.getElementById('shopModal').className = 'hidden';
        };

        window.selectPlan = function(plan) {
            petState.selectedPlan = plan;
            document.querySelectorAll('.price-item').forEach(function(el) { el.classList.remove('selected'); });
            event.target.closest('.price-item').classList.add('selected');
        };

        window.confirmPurchase = function() {
            if (!petState.selectedPlan) { alert('请选择套餐'); return; }
            petState.member = true;
            savePets();
            closeShop();
            showNotification('🎉 解锁成功！');
            document.getElementById('memberBadge').style.display = 'block';
            if (document.getElementById('mainApp').className.indexOf('hidden') === -1) {
                addSystemMessage('太棒了！我是会员了！💎');
            }
        };

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') sendChat();
        };

        async function sendChat() {
            var input = document.getElementById('chatInput');
            var message = input.value.trim();
            if (!message) return;
            
            addUserMessage(message);
            input.value = '';
            
            var thinkingMsg = document.createElement('div');
            thinkingMsg.textContent = '💭 思考中...';
            thinkingMsg.className = 'message thinking';
            document.getElementById('chatBox').appendChild(thinkingMsg);
            scrollChat();
            
            try {
                var systemPrompt = '你是' + petState.name + '，一个可爱的像素方块宠物。用中文回复，简短可爱。';
                
                var r = await fetch(AGNES_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + AGNES_API_KEY
                    },
                    body: JSON.stringify({
                        model: AGNES_MODEL,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: message }
                        ]
                    })
                });
                var d = await r.json();
                thinkingMsg.remove();
                
                var reply = d.choices && d.choices[0] && d.choices[0].message ? d.choices[0].message.content : '...';
                addPetMessage(reply);
                chatCount++;
            } catch(e) {
                thinkingMsg.remove();
                addPetMessage('网络错误~');
            }
        }

        function addUserMessage(text) {
            var msg = document.createElement('div');
            msg.className = 'message user';
            msg.textContent = text;
            document.getElementById('chatBox').appendChild(msg);
            scrollChat();
        }

        function addPetMessage(text) {
            var msg = document.createElement('div');
            msg.className = 'message pet';
            msg.textContent = text;
            document.getElementById('chatBox').appendChild(msg);
            scrollChat();
        }

        function addSystemMessage(text) {
            addPetMessage(text);
        }

        function scrollChat() {
            var box = document.getElementById('chatBox');
            box.scrollTop = box.scrollHeight;
        }

        function savePets() {
            var pets = JSON.parse(localStorage.getItem('blockpet_all') || '[]');
            pets[currentPetIndex] = petState;
            localStorage.setItem('blockpet_all', JSON.stringify(pets));
        }

        function showNotification(msg) {
            var n = document.getElementById('notification');
            n.textContent = msg;
            n.style.display = 'block';
            setTimeout(function() { n.style.display = 'none'; }, 2000);
        }

        init();
    </script>
</body>
</html>
